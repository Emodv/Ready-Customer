<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0a">
  <title>ReadyCustomer — Accept opportunity</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;background:#0b0b0a;color:#f4f0e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#211d14,#0b0b0a 55%)}main{width:min(100%,430px);background:#151512;border:1px solid #312d25;border-radius:28px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}.mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#c6ad73;color:#111;font-weight:800}h1{font-size:34px;line-height:1.02;margin:24px 0 12px;letter-spacing:-.04em}p{color:#aaa49a;line-height:1.6}.actions{display:grid;gap:12px;margin-top:26px}button{border:0;border-radius:16px;padding:16px 18px;font-size:16px;font-weight:700;cursor:pointer}.accept{background:#d2bb83;color:#111}.decline{background:#24231f;color:#eee;border:1px solid #39362e}.status{min-height:24px;margin-top:18px;color:#cfc7b8;font-size:14px}
  </style>
</head>
<body><main><div class="mark">R</div><h1>Exclusive flooring opportunity.</h1><p>This offer is held for 15 minutes. Accept it to claim the introduction, or decline so it can route to the next buyer.</p><div class="actions"><button class="accept" data-action="accept">Accept opportunity</button><button class="decline" data-action="decline">Decline</button></div><div class="status" id="status"></div></main>
<script>
const id=new URLSearchParams(location.search).get('match_id');
const status=document.getElementById('status');
document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',async()=>{if(!id){status.textContent='Missing match id.';return;}status.textContent='Updating…';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch('/api/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({match_id:id,action:btn.dataset.action})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to update offer.');status.textContent=btn.dataset.action==='accept'?'Accepted. The opportunity is yours.':'Declined. ReadyCustomer will route it onward.';}catch(e){status.textContent=e.message;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}));
</script></body></html>
